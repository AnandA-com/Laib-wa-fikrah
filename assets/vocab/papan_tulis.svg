<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#f0fdf4"/>
  <!-- Bingkai kayu papan tulis -->
  <rect x="18" y="24" width="84" height="60" rx="4" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <!-- Permukaan papan hijau -->
  <rect x="24" y="30" width="72" height="48" rx="2" fill="#166534"/>
  <!-- Tulisan kapur di papan -->
  <text x="60" y="58" text-anchor="middle" font-family="Amiri,serif" font-size="16" fill="#fef08a" font-weight="700">دَرْسٌ</text>
  <!-- Tatakan kapur & penghapus -->
  <rect x="22" y="84" width="76" height="4" fill="#a16207"/>
  <rect x="36" y="82" width="10" height="4" fill="#ffffff"/>
  <rect x="50" y="81" width="12" height="5" fill="#fef08a"/>
  <!-- Kaki penyangga tripod papan -->
  <line x1="30" y1="88" x2="22" y2="108" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="88" x2="98" y2="108" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="60" y2="108" stroke="#92400e" stroke-width="3"/>
</svg>