<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#fff1f2"/>
  <!-- Penghapus balok miring dua warna (pink & biru/putih) -->
  <g transform="rotate(-15 60 60)">
    <!-- Bagian kayu / pegangan atas -->
    <rect x="25" y="45" width="70" height="16" rx="3" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
    <!-- Bagian spons / kain bawah -->
    <rect x="27" y="61" width="66" height="18" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Tekstur kain -->
    <line x1="38" y1="65" x2="38" y2="75" stroke="#bae6fd" stroke-width="2"/>
    <line x1="50" y1="65" x2="50" y2="75" stroke="#bae6fd" stroke-width="2"/>
    <line x1="62" y1="65" x2="62" y2="75" stroke="#bae6fd" stroke-width="2"/>
    <line x1="74" y1="65" x2="74" y2="75" stroke="#bae6fd" stroke-width="2"/>
    <line x1="86" y1="65" x2="86" y2="75" stroke="#bae6fd" stroke-width="2"/>
  </g>
</svg>