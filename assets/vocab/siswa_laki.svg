  <polygon points="60,70 56,82 64,82" fill="#0284c7"/>
  <polygon points="60,82 57,98 60,102 63,98" fill="#0284c7"/>
  <!-- Tali ransel di bahu -->
  <line x1="42" y1="74" x2="42" y2="105" stroke="#ea580c" stroke-width="4"/>
  <line x1="78" y1="74" x2="78" y2="105" stroke="#ea580c" stroke-width="4"/>
</svg>