  <circle cx="54" cy="40" r="2.2" fill="#1e293b"/>
  <circle cx="66" cy="40" r="2.2" fill="#1e293b"/>
  <path d="M55 48 Q60 54 65 48" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <!-- Pipi merona -->
  <circle cx="50" cy="44" r="3" fill="#fca5a5" opacity=".7"/>
  <circle cx="70" cy="44" r="3" fill="#fca5a5" opacity=".7"/>
  <!-- Seragam kemeja putih & dasi biru/hijau -->
